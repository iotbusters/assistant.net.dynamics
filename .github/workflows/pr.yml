name: PR
on:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 100 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "9.0" }

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - run: dotnet restore assistant.net.dynamics.sln -v n
      - run: dotnet build assistant.net.dynamics.sln -c Release --no-restore -v n
      - run: dotnet test assistant.net.dynamics.sln -v n -c Release --no-restore --no-build -l junit -p:CollectCoverage=true -p:CoverletOutputFormat=opencover
      - uses: EnricoMi/publish-unit-test-result-action@v1
        with:
          files: |
            **/TestResults.xml
        if: always()
      - uses: actions/upload-artifact@v4
        with:
          name: pr-results
          path: |
            **/TestResults.xml
          retention-days: 60
        if: always()
